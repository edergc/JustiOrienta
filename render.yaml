services:
  - type: web
    name: justicia-orienta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && python -m app.cargar_directorio_excel && python -m app.cargar_titulares --sede "Sede Javier Alzamora Valdez" && python -m app.cargar_mapa_jav_nivel1 && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENTORNO
        value: produccion
      - key: JUSTICIA_ORIENTA_SECRET
        generateValue: true
      # Cadena de conexión a Postgres (Neon.tech u otro) -- deliberadamente
      # sin valor aquí: se pega a mano en el dashboard de Render para que la
      # contraseña de la base nunca quede en el repositorio. Formato:
      # postgresql+psycopg2://usuario:clave@host/basededatos?sslmode=require
      - key: DATABASE_URL
        sync: false
      # URL pública real del sitio en producción (sin barra final), para armar
      # el enlace del correo de "olvidé mi contraseña": .../admin?reset=token
      - key: URL_PUBLICA
        sync: false
      # SMTP para el correo de "olvidé mi contraseña" -- cualquier proveedor
      # (institucional, Gmail con contraseña de aplicación, etc.). Si se deja
      # sin configurar, el correo no se envía de verdad: solo queda en el log.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USUARIO
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_REMITENTE
        sync: false
