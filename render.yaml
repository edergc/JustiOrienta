services:
  - type: web
    name: justicia-orienta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENTORNO
        value: produccion
      - key: JUSTICIA_ORIENTA_SECRET
        generateValue: true
