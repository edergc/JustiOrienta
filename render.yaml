services:
  - type: web
    name: justicia-orienta
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && python -m app.seed && python -m app.cargar_directorio_excel && python -m app.cargar_titulares --sede "Sede Javier Alzamora Valdez" && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENTORNO
        value: produccion
      - key: JUSTICIA_ORIENTA_SECRET
        generateValue: true
      # Cadena de conexión a Postgres (Neon.tech u otro) -- deliberadamente
      # sin valor aquí: se pega a mano en el dashboard de Render para que la
      # contraseña de la base nunca quede en el repositorio. Formato:
      # postgresql+psycopg2://usuario:clave@host/basededatos?sslmode=require
      - key: DATABASE_URL
        sync: false
